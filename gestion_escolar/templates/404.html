<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - Página no encontrada</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .error-card {
            background-color: #ffffff;
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #1e40af;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .error-card h1 {
            font-size: 1.5rem;
            color: #111827;
            margin-bottom: 1rem;
        }

        .error-card p {
            font-size: 0.95rem;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn-primary {
            display: inline-block;
            background-color: #1e40af;
            color: #ffffff;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #1e3a8a;
        }
    </style>
</head>
<body>

    <main class="error-card">
        <div class="error-code">404</div>
        <h1>Página no encontrada</h1>
        <p>El recurso o módulo al que intentas acceder dentro del Portal Escolar no existe, fue movido o la dirección es incorrecta.</p>
        <a href="/" class="btn-primary">Volver al Inicio</a>
    </main>

</body>
</html>
